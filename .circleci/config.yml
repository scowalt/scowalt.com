version: 2.1

jobs:
  deploy-production:
    docker:
      - image: cimg/node:20.11
    steps:
      - checkout
      - run:
          name: "Install bun"
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> $BASH_ENV
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            bun --version
      - run:
          name: "Install Dependencies"
          command: "source $BASH_ENV && bun install"
      - run:
          name: "Build"
          command: "source $BASH_ENV && bun run build"
      - run:
          name: "Deploy to Cloudflare Pages"
          command: "npx wrangler pages deploy dist --project-name=scowalt-com --commit-dirty=true"

  deploy-preview:
    docker:
      - image: cimg/node:20.11
    steps:
      - checkout
      - run:
          name: "Install bun"
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> $BASH_ENV
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            bun --version
      - run:
          name: "Install Dependencies"
          command: "source $BASH_ENV && bun install"
      - run:
          name: "Build"
          command: "source $BASH_ENV && bun run build"
      - run:
          name: "Deploy Preview to Cloudflare Pages"
          command: "npx wrangler pages deploy dist --project-name=scowalt-com --commit-dirty=true"

workflows:
  deploy:
    jobs:
      - deploy-production:
          context: cloudflare-production
          filters:
            branches:
              only:
                - main
      - deploy-preview:
          context: cloudflare-preview
          filters:
            branches:
              ignore:
                - main 