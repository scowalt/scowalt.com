# Lighthouse Performance Testing
#
# IDEAL ARCHITECTURE (not implemented due to complexity):
# The ideal setup would be event-driven, where Cloudflare's deployment
# triggers this workflow with the preview URL. This would require:
# 1. Cloudflare to post deployment URLs in their check run output or status
# 2. GitHub webhook/event that includes the deployment URL
# 3. Or a custom Cloudflare Worker that calls GitHub API when deployment completes
#
# Since Cloudflare's GitHub integration doesn't expose deployment URLs
# in a way that GitHub Actions can easily consume, we're running Lighthouse
# against a local build instead. This still catches most performance issues
# but misses Cloudflare-specific optimizations and edge behavior.
#
# When Cloudflare improves their GitHub integration, we can switch to
# testing actual deployments using the event-driven approach.

name: Lighthouse Performance
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build

      - name: Start Wrangler dev server
        run: |
          # Use Wrangler to run the Cloudflare build locally
          bunx wrangler pages dev dist --port 4321 &
          echo $! > wrangler.pid
          # Give the server time to start
          sleep 10

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:4321
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Stop Wrangler server
        if: always()
        run: |
          if [ -f wrangler.pid ]; then
            kill $(cat wrangler.pid) || true
          fi

      - name: Format Lighthouse results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsPath = './lighthouse-results/manifest.json';

            if (!fs.existsSync(resultsPath)) {
              console.log('No Lighthouse results found');
              return;
            }

            const manifest = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
            const results = manifest.map(result => {
              const scores = result.summary;
              const formatScore = (score) => {
                const percentage = Math.round(score * 100);
                const emoji = percentage >= 90 ? '🟢' : percentage >= 50 ? '🟡' : '🔴';
                return `${emoji} ${percentage}`;
              };
              
              return `
                **${result.url}**
                - Performance: ${formatScore(scores.performance)}
                - Accessibility: ${formatScore(scores.accessibility)}
                - Best Practices: ${formatScore(scores['best-practices'])}
                - SEO: ${formatScore(scores.seo)}
              `;
            }).join('\n');

            // Post results as PR comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Lighthouse Results\n${results}\n\n[View detailed reports](${manifest[0].url})`
            });
