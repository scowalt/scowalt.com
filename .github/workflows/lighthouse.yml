name: Lighthouse Performance
on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Cloudflare deployment
        id: wait-for-deployment
        uses: actions/github-script@v7
        with:
          script: |
            // Wait up to 5 minutes for Cloudflare deployment
            for (let i = 0; i < 30; i++) {
              const checks = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.payload.pull_request.head.sha
              });
              
              const cfCheck = checks.data.check_runs.find(
                check => check.name === 'Workers Builds: scowalt-com'
              );
              
              if (cfCheck && cfCheck.status === 'completed' && cfCheck.conclusion === 'success') {
                // Extract URL from the check
                const urlMatch = cfCheck.details_url.match(/https:\/\/[a-z0-9-]+\.scowalt\.workers\.dev/);
                if (urlMatch) {
                  return urlMatch[0];
                }
              }
              
              console.log(`Waiting for Cloudflare deployment... (${i+1}/30)`);
              await new Promise(r => setTimeout(r, 10000)); // Wait 10 seconds
            }
            throw new Error('Cloudflare deployment not found after 5 minutes');

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.wait-for-deployment.outputs.result }}
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Format Lighthouse Score
        id: format-score
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('./lighthouse-results/manifest.json', 'utf8'));
            const result = manifest[0].summary;

            const formatScore = (score) => {
              const percentage = Math.round(score * 100);
              const emoji = percentage >= 90 ? '🟢' : percentage >= 50 ? '🟡' : '🔴';
              return `${emoji} ${percentage}`;
            };

            const scores = {
              performance: formatScore(result.performance),
              accessibility: formatScore(result.accessibility),
              'best-practices': formatScore(result['best-practices']),
              seo: formatScore(result.seo)
            };

            return scores;

      - name: Update PR Status
        uses: actions/github-script@v7
        with:
          script: |
            const scores = ${{ steps.format-score.outputs.result }};

            // Find the PR associated with this commit
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            const pr = prs.data.find(pr => pr.head.sha === context.sha);

            if (pr) {
              // Create a status check
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: 'success',
                target_url: `https://googlechrome.github.io/lighthouse/viewer/?jsonurl=${manifest[0].url}`,
                description: `Performance: ${scores.performance} | Accessibility: ${scores.accessibility}`,
                context: 'Lighthouse CI'
              });
            }
