name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-checks:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Read Bun version from mise
        id: bunversion
        run: echo "version=$(grep '^bun' .mise.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ steps.bunversion.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bunx astro check

      - name: Lint code
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

  worker-build:
    name: Worker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Read Bun version from mise
        id: bunversion
        run: echo "version=$(grep '^bun' .mise.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ steps.bunversion.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Validate Worker deployment without credentials
        run: bunx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'

  opentofu-validation:
    name: OpenTofu Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./opentofu
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Read OpenTofu version
        id: tofuversion
        run: echo "version=$(cat .opentofu-version)" >> "$GITHUB_OUTPUT"

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ steps.tofuversion.outputs.version }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6.3.1
        with:
          tflint_version: latest

      - name: Check OpenTofu formatting
        run: tofu fmt -check

      - name: Initialize OpenTofu without remote state
        run: tofu init -backend=false -input=false

      - name: Validate OpenTofu configuration
        run: tofu validate

      - name: Run TFLint
        run: tflint
