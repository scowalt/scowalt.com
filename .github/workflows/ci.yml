name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-checks:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Read Bun version from mise
        id: bunversion
        run: echo "version=$(grep '^bun' .mise.toml | cut -d'"' -f2)" >> $GITHUB_OUTPUT

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ steps.bunversion.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bunx astro check

      - name: Lint code
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Build project
        run: bun run build

  opentofu-validation:
    name: OpenTofu Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./opentofu
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Read OpenTofu version
        id: tofuversion
        run: echo "version=$(cat .opentofu-version)" >> $GITHUB_OUTPUT

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ steps.tofuversion.outputs.version }}

      - name: Setup Doppler CLI
        uses: dopplerhq/cli-action@v4.0.1

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6.3.0
        with:
          tflint_version: latest

      - name: Check OpenTofu formatting
        run: tofu fmt -check

      - name: Initialize OpenTofu
        run: doppler run -- tofu init
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Validate OpenTofu configuration
        run: doppler run -- tofu validate
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Run TFLint
        run: tflint
